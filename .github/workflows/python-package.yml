name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.12' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Webapp smoke tests
        run: |
          node scripts/keyboard_smoke.mjs
          node scripts/alphabet_smoke.mjs
          node scripts/i18n_check.mjs
